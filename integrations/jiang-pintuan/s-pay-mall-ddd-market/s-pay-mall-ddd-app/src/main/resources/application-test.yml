server:
  port: 8080

# 搴旂敤閰嶇疆
app:
  config:
    # 鐗堟湰锛屾柟渚块€氳繃鎺ュ彛鐗堟湰鍗囩骇
    api-version: v1
    # 璺ㄥ煙锛屽紑鍙戦樁娈靛彲浠ヨ缃负 * 涓嶉檺鍒?
    cross-origin: '*'
    # SC 娓犻亾閰嶇疆 - 鎷煎洟瀵规帴娓犻亾鍊笺€佸洖璋冮€氱煡
    group-buy-market:
      api-url: http://127.0.0.1:8091
      notify-url: http://127.0.0.1:8080/api/v1/alipay/group_buy_notify
      source: s01
      chanel: c01

# 绾跨▼姹犻厤缃?
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 鏁版嵁搴撻厤缃紱鍚姩鏃堕厤缃暟鎹簱璧勬簮淇℃伅
spring:
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://127.0.0.1:3306/s-pay-mall-ddd-market?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #鏈€灏忕┖闂茶繛鎺ユ暟閲?
    idle-timeout: 180000 #绌洪棽杩炴帴瀛樻椿鏈€澶ф椂闂达紝榛樿600000锛?0鍒嗛挓锛?
    maximum-pool-size: 25 #杩炴帴姹犳渶澶ц繛鎺ユ暟锛岄粯璁ゆ槸10
    auto-commit: true  #姝ゅ睘鎬ф帶鍒朵粠姹犺繑鍥炵殑杩炴帴鐨勯粯璁よ嚜鍔ㄦ彁浜よ涓?榛樿鍊硷細true
    max-lifetime: 1800000 #姝ゅ睘鎬ф帶鍒舵睜涓繛鎺ョ殑鏈€闀跨敓鍛藉懆鏈燂紝鍊?琛ㄧず鏃犻檺鐢熷懡鍛ㄦ湡锛岄粯璁?800000鍗?0鍒嗛挓
    connection-timeout: 30000 #鏁版嵁搴撹繛鎺ヨ秴鏃舵椂闂?榛樿30绉掞紝鍗?0000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource
  # RabbitMQ
  rabbitmq:
    addresses: 192.168.1.109
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        prefetch: 1 # 姣忔鎶曢€抧涓秷鎭紝娑堣垂瀹屽湪鎶曢€抧涓?
    template:
      delivery-mode: persistent # 纭繚鍏ㄥ眬榛樿璁剧疆涓烘寔涔呭寲锛堝彲閫夛級
    # 娑堟伅閰嶇疆
    config:
      # 鐢熶骇鑰?
      producer:
        # 涓婚閰嶇疆
        topic_order_pay_success:
          # 缁戝畾浜ゆ崲鏈?
          exchange: s_pay_mall_exchange
          # 娑堣垂涓婚
          routing_key: topic.order_pay_success
          # 娑堣垂闃熷垪
          queue: s_pay_mall_queue_2_order_pay_success
      consumer:
        # 涓婚閰嶇疆 topic 涓婚锛宼eam_success
        topic_team_success:
          # 缁戝畾浜ゆ崲鏈?- 娑堟伅鎻愪緵鑰呯殑浜ゆ崲鏈?
          exchange: group_buy_market_exchange
          # 娑堟伅涓婚
          routing_key: topic.team_success
          # 娑堣垂闃熷垪 - 姣忎釜绯荤粺鏈夎嚜宸辩殑娑堣垂闃熷垪
          queue: s_pay_mall_queue_2_topic_team_success
        # 涓婚閰嶇疆
        topic_order_pay_success:
          # 缁戝畾浜ゆ崲鏈?
          exchange: s_pay_mall_exchange
          # 娑堣垂涓婚
          routing_key: topic.order_pay_success
          # 娑堣垂闃熷垪
          queue: s_pay_mall_queue_2_order_pay_success

